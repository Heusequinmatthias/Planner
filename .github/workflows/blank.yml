name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          echo "--- installed ---"
          npm ls --depth=0 || true

      - name: Check the config
        run: |
          echo "--- files in the repo root ---"
          ls -1

          ok=0
          if [ -f capacitor.config.json ]; then
            if node -e "const c=require('./capacitor.config.json');if(!c.appId||!c.appName||!c.webDir)process.exit(1)" 2>/dev/null; then
              ok=1
            else
              echo "capacitor.config.json is present but not valid JSON, or is missing appId/appName/webDir."
            fi
          else
            echo "capacitor.config.json is missing."
          fi

          if [ "$ok" = "0" ]; then
            echo ">>> writing a known-good capacitor.config.json so the build can continue"
            cat > capacitor.config.json <<'JSON'
          {
            "appId": "be.plant.household",
            "appName": "PlanT",
            "webDir": "www",
            "android": {
              "allowMixedContent": false
            }
          }
          JSON
          fi

          echo "--- capacitor.config.json ---"
          cat capacitor.config.json

          if [ ! -f www/index.html ]; then
            echo "ERROR: www/index.html is missing - the app itself is not in the repo."
            exit 1
          fi
          echo "--- www/index.html is $(wc -c < www/index.html) bytes ---"

      - name: Create the Android project
        run: npx cap add android

      - name: Copy the web files in
        run: npx cap sync android

      - name: Put the PlanT icon in
        run: |
          RES=android/app/src/main/res
          mkdir -p "$RES/mipmap-anydpi-v26" "$RES/drawable" "$RES/values"

          cat > "$RES/drawable/plant_sprout.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <group android:translateX="54" android:translateY="37"
                   android:scaleX="1.05" android:scaleY="1.05">
              <path android:fillColor="#F0F5EE" android:pathData="M-2.2,1 C-2.2,14 -1.4,24 -1.2,34 L1.2,34 C1.4,24 2.2,14 2.2,1 Z"/>
              <path android:fillColor="#F0F5EE" android:pathData="M0,2 C-4,-1 -9,-2.2 -14.5,-1.2 C-19,-0.4 -21.5,1.6 -22,3.2 C-16,5.8 -8,5.2 -3.2,3.4 C-1.8,2.9 -0.6,2.4 0,2 Z"/>
              <path android:fillColor="#F0F5EE" android:pathData="M0,2 C4,-1 9,-2.2 14.5,-1.2 C19,-0.4 21.5,1.6 22,3.2 C16,5.8 8,5.2 3.2,3.4 C1.8,2.9 0.6,2.4 0,2 Z"/>
              <path android:fillColor="#F0F5EE" android:pathData="M-1.7,0.4 a1.7,1.7 0 1,0 3.4,0 a1.7,1.7 0 1,0 -3.4,0 Z"/>
            </group>
          </vector>
          XML

          cat > "$RES/values/plant_colors.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="plant_green">#1F4E39</color>
          </resources>
          XML

          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/plant_green"/>
            <foreground android:drawable="@drawable/plant_sprout"/>
          </adaptive-icon>
          XML

          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          echo "--- launcher resources after the swap ---"
          find "$RES" \( -name "*launcher*" -o -name "plant_*" \) | sort
          echo "--- what the adaptive icon points at ---"
          cat "$RES/mipmap-anydpi-v26/ic_launcher.xml"

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: plant-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
