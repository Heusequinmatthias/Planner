<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#EDEBE6">
<title>Planner</title>
<script>
window.onerror=function(m,s,l,c){
 document.documentElement.innerHTML='<body style="margin:0;padding:16px;background:#fff;color:#b00;font:13px monospace;white-space:pre-wrap">FOUT\n\n'+m+'\n\n'+s+'\nregel '+l+' kolom '+c+'</body>';
 return true};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#EDEBE6;color:#16181D;font-size:16px;line-height:1.5;padding-bottom:80px}
.wrap{max-width:440px;margin:0 auto;padding:16px}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-bottom:6px}
h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#7A7B80;margin-bottom:10px}
.sub{color:#62646B;font-size:15px;margin-bottom:22px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;text-align:left}
.btn{display:block;width:100%;background:#16181D;color:#fff;padding:15px;border-radius:12px;font-size:17px;font-weight:500;text-align:center;margin-top:12px}
.btn.ghost{background:none;color:#62646B;font-size:15px;font-weight:400;padding:12px;margin-top:2px}
.btn.warn{background:#C13B22}
.btn.soft{background:#fff;color:#16181D}
input[type=text],input[type=time],input[type=date]{width:100%;font:inherit;padding:13px 14px;border:1.5px solid #DAD8D2;border-radius:11px;background:#fff}
input:focus{outline:none;border-color:#16181D}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 15px;border-radius:20px;background:#fff;border:1.5px solid #DAD8D2;font-size:15px;margin:0 7px 8px 0}
.chip.on{border-color:transparent;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #EDEBE6;width:100%}
.row:last-child{border-bottom:none}
.muted{color:#7A7B80;font-size:14px}
.focus{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.25;margin:2px 0 4px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dh{text-align:center;font-size:12px;color:#9A9B9F;font-weight:600;padding-bottom:4px}
.day{position:relative;aspect-ratio:1;border-radius:9px;background:#F4F2ED;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;color:#9A9B9F;text-align:center}
.day.gap{background:#FBE4E0;color:#A33A28;font-weight:600}
.day.pad{background:none}
.day.tdy{box-shadow:inset 0 0 0 2px #16181D}
.day .dot{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.45}
.day.clash{box-shadow:inset 0 0 0 2px #D2452B}
.pop{position:fixed;inset:0;background:rgba(20,22,26,.4);display:flex;align-items:flex-end;z-index:50}
.sheet{background:#EDEBE6;width:100%;max-width:440px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px 16px 28px;max-height:88vh;overflow:auto}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #DAD8D2;display:flex;z-index:20;max-width:440px;margin:0 auto}
.tab{flex:1;padding:12px 4px;text-align:center;font-size:12px;font-weight:600;color:#9A9B9F}
.tab.on{color:#16181D}
.tab i{display:block;font-size:19px;font-style:normal;margin-bottom:3px}
.hint{background:#16181D;color:#fff;padding:11px 14px;border-radius:11px;font-size:15px;margin-bottom:12px;font-weight:500}
.sugg{background:#E3EBF7;color:#1B3E6E;padding:13px 15px;border-radius:12px;font-size:15px;margin-bottom:12px;width:100%}
.note{background:#E8E6E0;color:#3A3C42;padding:13px 15px;border-radius:12px;font-size:15px;margin-bottom:12px;width:100%}
.tk{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #EDEBE6;width:100%}
.tk:last-child{border-bottom:none}
.box{width:23px;height:23px;border-radius:7px;border:1.8px solid #C4C2BC;flex:none}
.box.on{background:#16181D;border-color:#16181D;position:relative}
.box.on:after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.done{color:#A0A1A5;text-decoration:line-through}
.seg{display:flex;background:#E1DFDA;border-radius:11px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:9px;font-size:14px;font-weight:500;color:#62646B;text-align:center}
.seg button.on{background:#fff;color:#16181D}
.fab{position:fixed;right:16px;bottom:92px;width:56px;height:56px;border-radius:50%;background:#16181D;color:#fff;font-size:28px;line-height:54px;text-align:center;z-index:21}
@keyframes fill{0%{transform:scale(.55);opacity:.3}100%{transform:scale(1);opacity:1}}
.anim{animation:fill .28s ease-out}
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="views1.js"></script>
<script src="views2.js"></script>
<script src="actions.js"></script>
</body>
</html>
